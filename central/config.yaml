host: 127.0.0.1
port: 8093
data_dir: data
ingest_interval_seconds: 60

frigate:
  base_url: http://127.0.0.1:5000
  pad_seconds: 15
  lead_seconds: 5

# WiGLE API credentials are entered under Settings (not stored in this file).
wigle:
  enabled: false
  base_url: https://api.wigle.net

chatterbox_tts:
  enabled: true
  base_url: http://127.0.0.1:8004
  voice_mode: clone
  reference_audio_filename: JLC_William_McEvoy.mp3
  output_format: wav
  timeout: 60
  cooldown_seconds: 120

# YAML clients are first-run bootstrap only. After that, add/edit/delete
# clients in the web UI — the database is the source of truth.
clients:
  - name: 192.168.0.164
    db_path: smb://192.168.0.164/sentinel/packet.db
    notes: Patio / Pi sensor over SMB
    enabled: true
